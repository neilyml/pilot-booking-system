spring:
  application:
    name: 'pilot-booking-system'
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:

        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

application:
  security:
    public-endpoints:
      - method: POST
        pattern: /api/v1/auth/register
      - method: POST
        pattern: /api/v1/auth/login
      - pattern: /v3/api-docs/**
      - pattern: /swagger-ui/**
      - pattern: /swagger-ui.html
      - pattern: /actuator/health
      - pattern: /actuator/health/**
    jwt:
      issuer: ${JWT_ISSUER:https://pilot-booking-system.local}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      secret: ${JWT_SECRET:}
